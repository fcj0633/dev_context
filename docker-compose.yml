services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    container_name: devcontext-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devcontext}
      POSTGRES_USER: ${POSTGRES_USER:-devcontext}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devcontext_dev}
    ports:
      - "5432:5432"
    volumes:
      - devcontext-postgres-data:/var/lib/postgresql
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  devcontext-postgres-data:
